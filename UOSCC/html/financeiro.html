<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Recursos - UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="main-container">
        <div class="content">
            <div class="page-header">
                <div>
                    <h1>Recursos recebidos</h1>
                    <p>Tudo o que a OSC recebeu: dinheiro, materiais e horas de voluntariado.</p>
                </div>
                <button class="btn">+ Novo recurso</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Ações</th>
                        <th>Data</th>
                        <th>Projeto</th>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Apoiador</th>
                        <th>Como foi usado</th>
                    </tr>
                </thead>
                <tbody id="tabela-recursos">
                </tbody>
            </table>
        </div>
    </div>
    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>

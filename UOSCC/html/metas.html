<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Indicadores - UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="main-container">
        <div class="content">
            <div class="page-header">
                <div>
                    <h1>Indicadores de resultado</h1>
                    <p>Meta planejada e valor alcançado (realizado) por projeto.</p>
                </div>
                <button class="btn">+ Novo indicador</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Ações</th>
                        <th>Projeto</th>
                        <th>Indicador</th>
                        <th>Data</th>
                        <th>Meta</th>
                        <th>Alcançado</th>
                        <th>Progresso</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-indicadores">
                </tbody>
            </table>
        </div>
    </div>
    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>

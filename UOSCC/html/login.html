<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login - Painel UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            justify-content: center;
            align-items: center;
            background-color: var(--primary-light);
            height: auto;
            min-height: 100vh;
            overflow-y: auto;
            padding: 24px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .login-card h2 {
            margin-bottom: 8px;
            color: var(--primary);
        }

        .login-card p {
            color: #6C757D;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        .login-card form + h3 { margin-top: 24px; }
        .login-card h3 { margin: 22px 0 12px; color: var(--primary); font-size: 1rem; }
        .login-card a { color: var(--primary); }
        .login-card [role="alert"] { color: #b02a37; font-size: .9rem; }
        .login-card .visitor-link { display: block; margin-top: 18px; text-align: center; }
    </style>
</head>

<body>
    <div class="login-card">
        <h2>Painel de Transparência</h2>
        <p>Acesse como OSC, administrador UOSCC ou apoiador.</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Entrar</button>
        </form>
        <h3>Primeiro acesso de apoiador</h3>
        <form id="signupForm">
            <div class="form-group">
                <label for="supporter-name">Nome</label>
                <input id="supporter-name" name="name" maxlength="200" autocomplete="name" required>
            </div>
            <div class="form-group">
                <label for="supporter-type">Tipo</label>
                <select id="supporter-type" name="type" required>
                    <option value="Pessoa">Pessoa</option>
                    <option value="Empresa">Empresa</option>
                </select>
            </div>
            <div class="form-group">
                <label for="signup-email">E-mail</label>
                <input id="signup-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="signup-password">Senha (mínimo 12 caracteres)</label>
                <input id="signup-password" name="password" type="password" minlength="12" autocomplete="new-password" required>
            </div>
            <p role="alert"></p>
            <button type="submit" class="btn" style="width: 100%;">Criar conta de apoiador</button>
        </form>
        <a class="visitor-link" href="publico.html">Continuar como visitante</a>
    </div>
    <script src="../js/app.js"></script>
</body>

</html>

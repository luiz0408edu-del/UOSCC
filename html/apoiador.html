<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu apoio - UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="main-container">
        <div class="content">
            <div class="page-header">
                <div>
                    <h1>Meu apoio</h1>
                    <p>Envie um apoio para análise e acompanhe as contribuições aprovadas.</p>
                </div>
            </div>
            <section class="report-section" aria-labelledby="enviar-apoio-titulo">
                <h2 id="enviar-apoio-titulo">Enviar um pedido de apoio</h2>
                <form id="support-request-form" class="account-form" enctype="multipart/form-data">
                    <label>Nome do apoiador<input name="name" type="text" readonly></label>
                    <label>Projeto<select name="project_id" required><option value="">Carregando projetos...</option></select></label>
                    <label>Indicador relacionado (opcional)<select name="indicator_id"><option value="">Sem vínculo</option></select></label>
                    <label>Tipo de apoio<select name="type" required><option value="">Selecione um projeto</option></select></label>
                    <label>Material a doar<input name="material_name" maxlength="200" hidden></label>
                    <label>Quantidade (R$, horas ou unidades)<input name="quantity" type="number" min="0.01" step="any" required></label>
                    <label>Unidade<select name="unit" hidden><option value="">Selecione a unidade</option><option>kg</option><option>g</option><option>litro</option><option>ml</option><option>unidade</option><option>peça</option><option>caixa</option><option>pacote</option></select></label>
                    <label>Detalhes do apoio<textarea name="description" maxlength="2000" required></textarea></label>
                    <label>Comprovante (imagem ou PDF, até 100 MB)<input name="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,application/pdf" required></label>
                    <p role="alert"></p>
                    <button type="submit" class="btn">Enviar para análise</button>
                </form>
            </section>
            <section class="report-section" aria-labelledby="pedidos-enviados-titulo">
                <h2 id="pedidos-enviados-titulo">Meus pedidos</h2>
                <div id="supporter-requests"></div>
            </section>
            <section class="report-section" aria-labelledby="apoios-aprovados-titulo">
                <h2 id="apoios-aprovados-titulo">Contribuições aprovadas</h2>
                <div id="supporter-resources"></div>
            </section>
        </div>
    </div>
    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Página Pública - UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="main-container">
        <div class="content">
            <div class="page-header">
                <div>
                    <h1>Página pública de transparência</h1>
                    <p>Consulte projetos, contribuições e materiais recebidos por OSC e período.</p>
                </div>
                <a class="btn" id="link-conta" href="login.html">Entrar</a>
            </div>
            <section id="perfil-apoiador-publico" class="report-output" hidden></section>
            <form id="consulta-apoiador" class="public-lookup">
                <label for="codigo-apoiador">Código de consulta</label>
                <input id="codigo-apoiador" name="token" type="text" inputmode="text" pattern="[a-fA-F0-9]{32}" maxlength="32" autocomplete="off" aria-describedby="ajuda-codigo">
                <button type="submit" class="btn">Consultar contribuição</button>
                <small id="ajuda-codigo">Use o código ou link fornecido pelo apoiador.</small>
            </form>
            <div id="resultado-apoiador" aria-live="polite"></div>
            <form id="public-filters" class="report-filters">
                <label>OSC
                    <select name="organization"><option value="">Todas as OSCs</option></select>
                </label>
                <label>De<input type="date" name="from"></label>
                <label>Até<input type="date" name="to"></label>
                <button type="submit" class="btn">Aplicar filtros</button>
            </form>
            <div id="conteudo-publico" class="report-output">
            </div>
        </div>
    </div>
    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Painel Geral - UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="main-container">
        <div class="content">
            <div class="page-header">
                <div>
                    <h1>Painel geral</h1>
                    <p>Visão de toda a rede de OSCs apoiadas pela UOSCC.</p>
                </div>
            </div>

            <form id="dashboard-filters" class="report-filters">
                <label id="dashboard-organization-filter">OSC
                    <select name="organization"><option value="">Todas as OSCs</option></select>
                </label>
                <label>De<input type="date" name="from"></label>
                <label>Até<input type="date" name="to"></label>
                <button type="submit" class="btn">Aplicar filtros</button>
            </form>
            <div class="card-grid" id="dashboard-cards">
                <div class="card" data-dashboard-card="dinheiro">
                    <h3>Dinheiro recebido</h3>
                    <div class="value" id="card-dinheiro">R$ 0</div>
                </div>
                <div class="card" data-dashboard-card="voluntariado">
                    <h3>Horas de voluntariado</h3>
                    <div class="value" id="card-voluntariado">0 h</div>
                </div>
                <div class="card" data-dashboard-card="pessoas">
                    <h3>Pessoas atendidas</h3>
                    <div class="value" id="card-pessoas">0</div>
                </div>
                <div class="card" data-dashboard-card="metas">
                    <h3>Metas concluídas</h3>
                    <div class="value" id="card-metas">0 / 0</div>
                </div>
                <div class="card" data-dashboard-card="evidencias">
                    <h3>Evidências registradas</h3>
                    <div class="value" id="card-evidencias">0</div>
                </div>
            </div>
            <div id="dashboard-materials"></div>
        </div>
    </div>
    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>

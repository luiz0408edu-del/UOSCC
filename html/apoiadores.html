<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Apoiadores - UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="main-container">
        <div class="content">
            <div class="page-header">
                <div>
                    <h1>Apoiadores</h1>
                    <p>Empresas, pessoas e o poder público que apoiam as iniciativas.</p>
                </div>
                <button class="btn">+ Novo apoiador</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Ações</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Total Apoiado</th>
                        <th>Consulta pública</th>
                    </tr>
                </thead>
                <tbody id="tabela-apoiadores"></tbody>
            </table>
        </div>
    </div>
    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Relatórios - UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="main-container">
        <div class="content">
            <div class="page-header">
                <div>
                    <h1>Relatório de prestação de contas</h1>
                    <p>Prestação de contas por OSC e período.</p>
                </div>
            </div>
            <form id="report-filters" class="report-filters">
                <label>OSC
                    <select name="organization">
                        <option value="">Todas as OSCs</option>
                    </select>
                </label>
                <label>De
                    <input type="date" name="from">
                </label>
                <label>Até
                    <input type="date" name="to">
                </label>
                <button type="submit" class="btn">Aplicar filtros</button>
                <button type="button" class="btn" id="exportar-csv">Exportar planilha</button>
                <button type="button" class="btn" id="exportar-pdf">Exportar PDF</button>
            </form>
            <section class="report-section">
                <div class="page-header">
                    <div>
                        <h2>Registro de pessoas atendidas</h2>
                        <p>Inclua ou remova quantidades por projeto e data, sem cadastrar dados pessoais.</p>
                    </div>
                    <button class="btn" type="button">Registrar atendimento</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Ações</th>
                            <th>Data</th>
                            <th>Projeto</th>
                            <th>Pessoas</th>
                            <th>Observação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pessoas"></tbody>
                </table>
            </section>
            <form id="report-note-form" class="report-note-form">
                <label>Título do relatório
                    <input name="title" type="text" maxlength="200" required>
                </label>
                <label>Texto de prestação de contas
                    <textarea name="narrative" maxlength="50000" rows="6" required></textarea>
                </label>
                <p role="status" aria-live="polite"></p>
                <button type="submit" class="btn">Salvar texto do relatório</button>
            </form>
            <div id="relatorio-conteudo" class="report-output"></div>
        </div>
    </div>
    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
